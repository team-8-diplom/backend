name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          python-version: '3.13'

      - name: Run tests
        run: uv run pytest --junitxml=test-results.xml -v

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  build-and-deploy:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_IMAGE_TAG: ${{ needs.release.outputs.new_release_git_tag }}
      DOCKER_USER: ${{ vars.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      DATABASE__DRIVER: ${{ vars.DATABASE__DRIVER }}
      DATABASE__HOST: ${{ vars.DATABASE__HOST }}
      DATABASE__PORT: ${{ vars.DATABASE__PORT }}
      DATABASE__USER: ${{ vars.DATABASE__USER }}
      DATABASE__PASSWORD: ${{ secrets.DATABASE__PASSWORD }}
      DATABASE__NAME: ${{ vars.DATABASE__NAME }}
      AUTH__JWT_SECRET_KEY: ${{ secrets.AUTH__JWT_SECRET_KEY }}
      AUTH__JWT_ALGORITHM: ${{ vars.AUTH__JWT_ALGORITHM }}
      AUTH__JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${{ vars.AUTH__JWT_ACCESS_TOKEN_LIFETIME_MINUTES }}
      AUTH__JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${{ vars.AUTH__JWT_REFRESH_TOKEN_LIFETIME_DAYS }}
      AUTH__CONFIRMATION_TOKEN_LIFETIME_HOURS: ${{ vars.AUTH__CONFIRMATION_TOKEN_LIFETIME_HOURS }}
      AUTH__RESET_PASSWORD_TOKEN_LIFETIME_MINUTES: ${{ vars.AUTH__RESET_PASSWORD_TOKEN_LIFETIME_MINUTES }}
      AUTH_BOOTSTRAP__ADMIN_EMAIL: ${{ vars.AUTH_BOOTSTRAP__ADMIN_EMAIL }}
      AUTH_BOOTSTRAP__ADMIN_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP__ADMIN_PASSWORD }}
      AUTH_BOOTSTRAP__DEFAULT_USER_ROLE: ${{ vars.AUTH_BOOTSTRAP__DEFAULT_USER_ROLE }}
      AUTH_BOOTSTRAP__ADMIN_ROLE: ${{ vars.AUTH_BOOTSTRAP__ADMIN_ROLE }}
      SMTP__USERNAME: ${{ vars.SMTP__USERNAME }}
      SMTP__PASSWORD: ${{ secrets.SMTP__PASSWORD }}
      SMTP__FROM_EMAIL: ${{ vars.SMTP__FROM_EMAIL }}
      SMTP__FROM_NAME: ${{ vars.SMTP__FROM_NAME }}
      SMTP__HOST: ${{ vars.SMTP__HOST }}
      SMTP__PORT: ${{ vars.SMTP__PORT }}
      SMTP__STARTTLS: ${{ vars.SMTP__STARTTLS }}
      SMTP__SSL_TLS: ${{ vars.SMTP__SSL_TLS }}
      SMTP__USE_CREDENTIALS: ${{ vars.SMTP__USE_CREDENTIALS }}
      NOTIFICATIONS__FRONTEND_BASE_URL: ${{ vars.NOTIFICATIONS__FRONTEND_BASE_URL }}
      CORS__ALLOW_ORIGINS: ${{ vars.CORS__ALLOW_ORIGINS }}
      CORS__ALLOW_CREDENTIALS: ${{ vars.CORS__ALLOW_CREDENTIALS }}
      CORS__ALLOW_METHODS: ${{ vars.CORS__ALLOW_METHODS }}
      CORS__ALLOW_HEADERS: ${{ vars.CORS__ALLOW_HEADERS }}
      RATELIMIT__ENABLED: ${{ vars.RATELIMIT__ENABLED }}
      RATELIMIT__DEFAULT_LIMIT: ${{ vars.RATELIMIT__DEFAULT_LIMIT }}
      RATELIMIT__AUTH_LIMIT: ${{ vars.RATELIMIT__AUTH_LIMIT }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          python-version: '3.13'
          install-ansible: 'true'
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run build-image playbook
        run: ansible-playbook ansible/playbooks/build-image.yml -i ansible/inventory.yml

      - name: Run deploy playbook
        run: ansible-playbook ansible/playbooks/deploy.yml -i ansible/inventory.yml
