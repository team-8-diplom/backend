name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          python-version: '3.13'

      - name: Run tests
        run: uv run pytest --junitxml=test-results.xml -v

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  build-and-deploy:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      DOCKER_IMAGE_TAG: ${{ needs.release.outputs.new_release_git_tag }}
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      ENV: ${{ secrets.ENV }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          python-version: '3.13'
          install-ansible: 'true'
          ssh-private-key-b64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run build-image playbook
        run: ansible-playbook ansible/playbooks/build-image.yml -i ansible/inventory.yml

      - name: Run deploy playbook
        run: ansible-playbook ansible/playbooks/deploy.yml -i ansible/inventory.yml
