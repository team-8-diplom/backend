<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7; padding: 24px 0;">
        <tr>
            <td align="center">
                <table width="100%" cellspacing="0" cellpadding="0" style="max-width: 570px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e8e8ed; overflow: hidden;">
                    <tr>
                        <td style="padding: 40px 32px; text-align: left;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 32px 32px 32px; text-align: center;">
                            <p style="margin: 0; font-size: 13px; color: #a8a8b3;">Это автоматическое письмо. Пожалуйста, не отвечайте на него.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
